<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wow Parenting — Flipbook</title>
<style>
  :root {
    --bg: #1a1410;
    --bg-2: #2a1f17;
    --ink: #f3ead9;
    --accent: #d4a574;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at center, var(--bg-2), var(--bg));
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(26, 20, 16, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(212,165,116,0.25);
    z-index: 100;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: 0.5px; }
  header .spacer { flex: 1; }
  .btn {
    background: transparent;
    color: var(--ink);
    border: 1px solid rgba(212,165,116,0.5);
    padding: 7px 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    border-radius: 3px;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(212,165,116,0.15); border-color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #pageInfo { font-size: 13px; opacity: 0.8; min-width: 90px; text-align: center; }

  #stage {
    position: absolute;
    top: 56px; bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }
  #book { user-select: none; }
  #book .page {
    background: #fdfaf3;
    color: #222;
    overflow: hidden;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.1);
  }
  #book .page img, #book .page canvas {
    width: 100%; height: 100%; display: block;
    object-fit: contain;
  }
  #book .page-cover {
    background: linear-gradient(135deg, #5a3a24, #3a2415);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    font-size: 22px;
    letter-spacing: 2px;
  }

  #loader {
    position: absolute;
    inset: 56px 0 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  #loader.hidden { opacity: 0; }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(212,165,116,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadMsg { font-size: 14px; opacity: 0.8; }

  #picker {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    max-width: 420px;
    padding: 24px;
  }
  #picker.show { display: flex; }
  #picker p { margin: 0; opacity: 0.85; line-height: 1.5; font-size: 14px; }
  #picker input[type=file] {
    color: var(--ink);
    font-family: inherit;
  }
</style>
</head>
<body>

<header>
  <h1>📖 Wow Parenting Book</h1>
  <div class="spacer"></div>
  <button class="btn" id="prevBtn">◀ Prev</button>
  <span id="pageInfo">— / —</span>
  <button class="btn" id="nextBtn">Next ▶</button>
  <button class="btn" id="fsBtn">⛶ Fullscreen</button>
</header>

<div id="stage">
  <div id="book"></div>
  <div id="loader">
    <div class="spinner"></div>
    <div id="loadMsg">Loading PDF…</div>
  </div>
  <div id="picker">
    <p>Couldn't auto-load <b>wow-parenting-book.pdf</b> (browsers block local files when opened directly). Pick the PDF to continue — nothing leaves your computer.</p>
    <input type="file" id="fileInput" accept="application/pdf" />
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    window.__pdfjsLib = pdfjsLib;
  }
</script>

<script>
(function(){
  const PDF_URL = "wow-parenting-book.pdf";
  const loader = document.getElementById("loader");
  const loadMsg = document.getElementById("loadMsg");
  const picker = document.getElementById("picker");
  const fileInput = document.getElementById("fileInput");
  const bookEl = document.getElementById("book");
  const pageInfo = document.getElementById("pageInfo");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const fsBtn = document.getElementById("fsBtn");

  let pageFlip = null;

  async function renderPdfToImages(pdfData) {
    const pdfjsLib = window.__pdfjsLib || window.pdfjsLib;
    if (!pdfjsLib) throw new Error("PDF.js library did not load");
    const loadingTask = pdfData instanceof ArrayBuffer
      ? pdfjsLib.getDocument({ data: pdfData })
      : pdfjsLib.getDocument(pdfData);
    const pdf = await loadingTask.promise;
    const images = [];
    const total = pdf.numPages;
    const SCALE = 1.6;

    for (let i = 1; i <= total; i++) {
      loadMsg.textContent = `Rendering page ${i} of ${total}…`;
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: SCALE });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext("2d");
      await page.render({ canvasContext: ctx, viewport }).promise;
      images.push(canvas.toDataURL("image/jpeg", 0.85));
    }
    return images;
  }

  function computeSize(imgRatio) {
    const stage = document.getElementById("stage");
    const availW = stage.clientWidth - 40;
    const availH = stage.clientHeight - 48;
    const portrait = window.innerWidth < 800;
    const pagesWide = portrait ? 1 : 2;
    let pageH = availH;
    let pageW = pageH * imgRatio;
    if (pageW * pagesWide > availW) {
      pageW = availW / pagesWide;
      pageH = pageW / imgRatio;
    }
    return { w: Math.floor(pageW), h: Math.floor(pageH) };
  }

  async function buildFlipbook(images) {
    loadMsg.textContent = "Preparing flipbook…";
    let PageFlipCtor;
    try { PageFlipCtor = await window.__waitForPageFlip(); }
    catch (e) { loadMsg.textContent = "Flipbook library failed to load. Check your internet connection."; return; }

    const first = new Image();
    first.onload = () => {
      const ratio = first.naturalWidth / first.naturalHeight;
      const { w, h } = computeSize(ratio);

      bookEl.innerHTML = "";
      images.forEach((src, idx) => {
        const d = document.createElement("div");
        d.className = "page";
        if (idx === 0 || idx === images.length - 1) d.classList.add("hard");
        const img = document.createElement("img");
        img.src = src;
        d.appendChild(img);
        bookEl.appendChild(d);
      });

      pageFlip = new PageFlipCtor(bookEl, {
        width: w,
        height: h,
        size: "fixed",
        minWidth: 200,
        maxWidth: w,
        minHeight: 300,
        maxHeight: h,
        maxShadowOpacity: 0.5,
        showCover: true,
        mobileScrollSupport: false,
        drawShadow: true,
        flippingTime: 800,
        usePortrait: window.innerWidth < 800
      });

      pageFlip.loadFromHTML(bookEl.querySelectorAll(".page"));

      const total = pageFlip.getPageCount();
      const updateInfo = () => {
        const current = pageFlip.getCurrentPageIndex() + 1;
        pageInfo.textContent = `${current} / ${total}`;
      };
      pageFlip.on("flip", updateInfo);
      updateInfo();

      loader.classList.add("hidden");
      setTimeout(() => loader.style.display = "none", 400);
    };
    first.src = images[0];
  }

  prevBtn.addEventListener("click", () => pageFlip && pageFlip.flipPrev());
  nextBtn.addEventListener("click", () => pageFlip && pageFlip.flipNext());
  document.addEventListener("keydown", (e) => {
    if (!pageFlip) return;
    if (e.key === "ArrowLeft") pageFlip.flipPrev();
    if (e.key === "ArrowRight") pageFlip.flipNext();
  });
  fsBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });
  window.addEventListener("resize", () => {
    if (!pageFlip) return;
    // rebuild size on resize
    const img = bookEl.querySelector("img");
    if (!img) return;
    const ratio = img.naturalWidth / img.naturalHeight;
    const { w, h } = computeSize(ratio);
    pageFlip.update({ width: w, height: h, maxWidth: w, maxHeight: h, usePortrait: window.innerWidth < 800 });
  });

  function showPicker(reason) {
    console.warn("Auto-load fell back to picker:", reason);
    loader.classList.add("hidden");
    setTimeout(() => { loader.style.display = "none"; picker.classList.add("show"); }, 200);
  }

  async function tryAutoLoad() {
    // On file:// Chrome blocks fetch — go straight to picker.
    if (location.protocol === "file:") {
      showPicker("file:// protocol — browser blocks fetch of local files");
      return;
    }
    try {
      loadMsg.textContent = "Loading PDF…";
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const resp = await fetch(PDF_URL, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const buf = await resp.arrayBuffer();
      const imgs = await renderPdfToImages(buf);
      buildFlipbook(imgs);
    } catch (err) {
      showPicker(err && err.message);
    }
  }

  fileInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    picker.classList.remove("show");
    loader.style.display = "flex";
    loader.classList.remove("hidden");
    const buf = await file.arrayBuffer();
    const imgs = await renderPdfToImages(buf);
    buildFlipbook(imgs);
  });

  function getPageFlipCtor() {
    if (window.St && window.St.PageFlip) return window.St.PageFlip;
    if (window.PageFlip) return window.PageFlip;
    return null;
  }
  function waitForPageFlip() {
    return new Promise((res, rej) => {
      if (getPageFlipCtor()) return res(getPageFlipCtor());
      let tries = 0;
      const t = setInterval(() => {
        const C = getPageFlipCtor();
        if (C) { clearInterval(t); res(C); }
        else if (++tries > 100) { clearInterval(t); rej(new Error("page-flip failed to load")); }
      }, 100);
    });
  }
  window.__waitForPageFlip = waitForPageFlip;

  // Kick off immediately — PDF rendering doesn't need PageFlip
  window.addEventListener("load", tryAutoLoad);
})();
</script>

</body>
</html>
